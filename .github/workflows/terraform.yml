name: Terraform Validate

# Format and validation checks only. This public workflow holds no cloud
# credentials and never plans or applies against a live account; deployments
# run from the operator's own private pipeline with its own state and variables.

on:
  push:
    branches: [main]
    paths: ['**.tf', '.terraform.lock.hcl', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    paths: ['**.tf', '.terraform.lock.hcl', '.github/workflows/terraform.yml']

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ['.', 'bootstrap']
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color
